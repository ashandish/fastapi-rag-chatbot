version: "3.9"
services:
  app:
    build: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./data:/data
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=2
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
