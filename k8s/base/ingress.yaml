apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-chatbot
  namespace: rag-chatbot
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - rag.example.com
      secretName: rag-chatbot-tls
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-chatbot-app
                port:
                  number: 80
