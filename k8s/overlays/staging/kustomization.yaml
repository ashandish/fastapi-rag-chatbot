apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secret.yaml
images:
  - name: ghcr.io/your-org/fastapi-rag-chatbot
    newTag: staging-latest
patches:
  - target:
      kind: Ingress
      name: rag-chatbot
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rag-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: rag-staging.example.com
